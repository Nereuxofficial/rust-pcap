[package]
name = "rust-pcap-ebpf"
description = "eBPF program for rust-pcap"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
rust-pcap-common = { version = "0.1", path = "../rust-pcap-common" }
aya-ebpf = { workspace = true }
aya-log-ebpf = { workspace = true }

[build-dependencies]
which = { workspace = true }

[features]
# The binary can only be compiled for an eBPF target. Keeping it opt-in lets
# `cargo package` verify this crate's portable library target on the host.
ebpf = []

[[bin]]
name = "rust-pcap"
path = "src/main.rs"
required-features = ["ebpf"]
